<title>OSCARS Results Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&family=Ubuntu+Mono&display=swap">
<style>
:root{
  --bg:#F6F5FA; --surface:#FFFFFF; --surface-2:#EFEDF6; --ink:#1C1833; --ink-2:#4B4566; --muted:#77718F;
  --line:#DEDAEA; --accent:#37277C; --accent-2:#2FA0DB; --accent-ink:#FFFFFF; --focus:#2FA0DB;
  --chip:#ECE8F7; --chip-ink:#37277C; --org:#1E7A52; --org-bg:#E3F3EA; --att:#4463A0; --att-bg:#E6ECF7;
  --shadow:0 1px 2px rgba(28,24,51,.06),0 2px 8px rgba(28,24,51,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131126; --surface:#1C1934; --surface-2:#252142; --ink:#ECEAF6; --ink-2:#C3BEDA; --muted:#9A94B6;
    --line:#332E55; --accent:#B7A8F0; --accent-2:#63BDEB; --accent-ink:#131126; --focus:#63BDEB;
    --chip:#2B2650; --chip-ink:#D6CEFA; --org:#7FD6A8; --org-bg:#1D3A2E; --att:#9FB7EA; --att-bg:#23304D;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131126; --surface:#1C1934; --surface-2:#252142; --ink:#ECEAF6; --ink-2:#C3BEDA; --muted:#9A94B6;
  --line:#332E55; --accent:#B7A8F0; --accent-2:#63BDEB; --accent-ink:#131126; --focus:#63BDEB;
  --chip:#2B2650; --chip-ink:#D6CEFA; --org:#7FD6A8; --org-bg:#1D3A2E; --att:#9FB7EA; --att-bg:#23304D;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Ubuntu',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:'Ubuntu Mono',ui-monospace,Menlo,monospace}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{font-family:'Quicksand','Ubuntu',sans-serif;font-weight:700;font-size:clamp(24px,3.2vw,32px);color:var(--accent);margin:4px 0 2px;text-wrap:balance}
.lede{color:var(--ink-2);max-width:68ch;margin:0}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:'Quicksand',sans-serif;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;font-weight:500;font-size:15px;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:var(--muted);margin-left:6px}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

aside.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
@media (max-width:900px){aside.filters{position:static;max-height:none}}
details.fwrap>summary{display:none}
@media (max-width:900px){
  details.fwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  details.fwrap>summary{display:block;cursor:pointer;font-weight:500;color:var(--accent)}
}
.fgroup{border-top:1px solid var(--line);padding:12px 0}
.fgroup:first-child{border-top:0;padding-top:0}
.fgroup h3{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 8px}
.opt{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;color:var(--ink);font-size:13.5px}
.opt input{accent-color:var(--accent);margin:0;flex:none}
.opt .lab{flex:1;min-width:0}
.opt .c{font-family:'Ubuntu Mono',monospace;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt.zero{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
select.fsel{width:100%;font:inherit;font-size:13px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.fnote{font-size:12px;color:var(--muted);margin:6px 0 0}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;font:inherit;font-size:15px;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.btn{appearance:none;font:inherit;font-size:13.5px;font-weight:500;border-radius:9px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.resline{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;color:var(--ink-2);font-size:13px;margin-bottom:12px}
.resline b{color:var(--ink);font-variant-numeric:tabular-nums}
.msg{font-size:12.5px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.card .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .id{margin-left:auto;font-size:12px;color:var(--muted)}
.typechip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-2)}
.tag{font-size:11px;font-weight:500;border-radius:5px;padding:1px 7px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.tag.org{background:var(--org-bg);color:var(--org)}
.tag.att{background:var(--att-bg);color:var(--att)}
.tag.warn{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.ctitle{font-weight:500;font-size:15px;line-height:1.35;overflow-wrap:anywhere;margin:0}
.ctitle a{text-decoration:none}
.ctitle a:hover{text-decoration:underline}
.desc{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{-webkit-line-clamp:unset;display:block}
.more{appearance:none;background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:12.5px;cursor:pointer;align-self:flex-start}
.when{font-size:12.5px;color:var(--ink-2)}
.when b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.links a{overflow-wrap:anywhere}
.rel{font-size:12.5px;color:var(--ink-2)}
.idlink{appearance:none;background:none;border:0;padding:0;font-family:'Ubuntu Mono',monospace;font-size:12.5px;color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted}
.proj{margin-top:auto;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:5px}
.proj .pt{color:var(--ink)}
.proj .pt a{color:inherit}
.cls{display:flex;flex-wrap:wrap;gap:4px}
.cl{font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:4px;padding:1px 6px;color:#fff}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--ink-2)}
.pager{display:flex;justify-content:center;margin-top:16px}
footer.note{margin-top:32px;color:var(--muted);font-size:12.5px;max-width:90ch}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--accent-2)}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">OSCARS · Horizon Europe · funded projects</div>
      <h1>OSCARS Results Explorer</h1>
      <p class="lede">Search the outputs and events of the 70 projects funded through the OSCARS Open Calls: software, datasets, platforms, publications, training resources and the events where the projects presented and trained.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="tabs" role="tablist" aria-label="What to search">
    <button class="tab" role="tab" id="tab-outputs" aria-selected="true" aria-controls="panel">Outputs<span class="n" id="n-outputs"></span></button>
    <button class="tab" role="tab" id="tab-events" aria-selected="false" aria-controls="panel">Events<span class="n" id="n-events"></span></button>
  </div>

  <div class="layout">
    <aside class="filters" aria-label="Filters">
      <details class="fwrap" id="fwrap" open>
        <summary>Filters</summary>
        <div id="facets"></div>
      </details>
    </aside>
    <main id="panel" role="tabpanel">
      <div class="toolbar">
        <label class="search" for="q">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search titles, descriptions, projects, IDs…" autocomplete="off">
        </label>
        <button class="btn" id="reset" type="button">Reset filters</button>
        <button class="btn primary" id="dl" type="button">
          <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v8M3.5 5.5L7 9l3.5-3.5M1.5 12.5h11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Download results (.xlsx)

e examples of scientific applications will be given. A large fraction of the time will be dedicated to hands-on exercises, which will allow participants to become fully familiar with the VO capabilities on their own laptops.","l":["https://indico.in2p3.fr/event/36738/"],"re":"EVT-0029","tr":"T1 – training activity"},{"i":"OUT-0039","p":"01-073","ty":"Publications","t":"BioHackathon 2025 preprint: Evolving FAIR image analysis in Galaxy for cross-domain and AI-ready applications","l":["https://osf.io/preprints/biohackrxiv/tsxby_v1"],"re":"EVT-0045"},{"i":"OUT-0040","p":"01-073","ty":"Posters","t":"FIESTA — project poster","l":["https://doi.org/10.5281/zenodo.18798625"]},{"i":"OUT-0041","p":"01-073","ty":"Presentations & Training Resources","k":"Material","t":"First cross-disciplinary tutorial available","l":["https://training.galaxyproject.org/training-material/topics/imaging/tutorials/voronoi-segmentation/tutorial.html"],"tr":"T2 – learning material"},{"i":"OUT-0042","p":"01-073","ty":"Presentations & Training Resources","k":"Training activity","t":"Hackathon Image Analysis in Galaxy","d":"22-26 April 2025 · Freiburg, Germany","l":["https://galaxyproject.org/events/2025-04-22-galaxy-imaging-hackathon/"],"re":"EVT-0036","tr":"T1 – training activity"},{"i":"OUT-0043","p":"01-073","ty":"Presentations & Training Resources","k":"Training activity","t":"FIESTA had a dedicated track and individual presentations at the 2nd AstroORDAS workshop","d":"8-12 December 2025 · Bernoulli center EPFL, Lausanne, Switzerland","l":["https://indico.global/event/14045/"],"re":"EVT-0046","tr":"T1 – training activity"},{"i":"OUT-0044","p":"01-076","ty":"Software & Tools","t":"Ontology service in NOMAD","d":"NOMAD’s pynxtools plugin, responsible for parsing and normalising NeXus data, has been extended with an ontology service that injects all relevant experiment-technique terms into the metadata of uploaded datasets.","l":["https://github.com/FAIRmat-NFDI/pynxtools"]},{"i":"OUT-0045","p":"01 ics","l":["https://www.aanda.org/articles/aa/full_html/2026/03/aa57749-25/aa57749-25.html"]},{"i":"OUT-0070","p":"01-080","ty":"Presentations & Training Resources","k":"Training activity","t":"Hackathon organised by the COPLI project to work with experts on improving the au[tomation]","d":"6 May - 8 May, 2025","re":"EVT-0063","tr":"T1 – training activity"},{"i":"OUT-0071","p":"01-124","ty":"Software & Tools","t":"WebX — remote desktop engine for VISA (GitHub)","d":"New window-based remote desktop engine built to replace Guacamole in VISA, letting multiple users share an instance and collaboratively analyse the same experimental data. Captures X11 windows directly, transmits over ZeroMQ with low CPU/bandwidth overhead, and streams to the browser via libjpeg-turbo compression. Final version released February 2026 for the March 2026 ILL reactor startup; now in production at ILL, ESRF, Soleil, ALBA, DESY and XFEL. User feedback has been very positive, with notable gains in latency and visual quality. Fully open source (GPL-3.0 / BSD-3-Clause), with a Docker demo available.","l":["https://github.com/ILLGrenoble/"]},{"i":"OUT-0072","p":"01-124","ty":"Infrastructure & Services","t":"VISA","d":"The Virtual Infrastructure for Scientific Analysis platform itself. Not developed at first within OSCARS, but further developed in this context (e.g. via the WebX engine above). Shown for context; not counted as a new output in the charts.","l":["https://visa.ill.fr/"]},{"i":"OUT-0073","p":"01-124","ty":"Posters","t":"VISA — project poster","l":["https://doi.org/10.5281/zenodo.18775365"]},{"i":"OUT-0074","p":"01-124","ty":"Technical Documentation","t":"Documentation","d":"Full documentation for VISA and the WebX remote desktop engine, maintained on Read the Docs.","l":["https://visa.readthedocs.io"],"tr":"T2 – learning material (user guide / manual; stays in Technical Documentation)"},{"i":"OUT-0075","p":"01-154","ty":"Software & Tools","d":"Automated AI GIXD fits: An AI tool that takes GIXD images as input and predicts the unit cell has been created and benchmarked on prototypical GIXD test cases."},{"i":"OUT-0076","p":"01-154","ty":"Datasets & Databases","d":"FAIR metadata generation for database-ready datasets. Collection of X-ray data: We have curated datasets of X-ray data for the XRR and GIXD techniques. Collection efforts from published literature are continuing."},{"i":"OUT-0077","p":"01-154","ty":"Workflows & Pipelines","d":"XRR & neutron reflectometry workflow operational. GID workflow: reciprocal-space mapping, Bragg peak detection & unit-cell matching."},{"i":"OUT-0078","p":"01-154","ty":"Publications","t":"KCl-Mediated Defect Passivation in Vapor-Deposited Perovskites","l":["https://doi.org/10.1021/acsami.5c09426"]},{"i":"OUT-0079","p":"01-154","ty":"Posters","t":"AI-SCOPE — project poster","l":["https://doi.org/10.5281/zenodo.18827596"]},{"i":"OUT-0080","p":"01-163","ty":"Software & Tools","d":"Open source data analysis software."},{"i":"OUT-0081","p":"01-163","ty":"Ontologies & Standards","d":"First try of an archiving format using Nexus - HDF5."},{"i":"OUT-0082","p":"01-163","ty":"Posters","t":"HiMAGNETOS — project poster","l":["https://doi.org/10.5281/zenodo.18797627"]},{"i":"OUT-0083","p":"01-163","ty":"Repositories","t":"First dataset deposit","d":"First dataset deposit: The first dataset has been deposited, curated, and published on indicating that the repos is up and running","l":["https://entrepot.recherche.data.gouv.fr/dataverse/lncmi"]},{"i":"OUT-0084","p":"01-163","ty":"Workflows & Pipelines","t":"Software repos for the data analysis pipeline","l":["https://gitlab.in2p3.fr/himagnetos/"]},{"i":"OUT-0085","p":"01-163","ty":"Presentations & Training Resources","k":"Training activity","t":"S³ School — Sustainable Scientific Software School (Annecy, 14-21 January 2026)","d":"The main software developed in the HiMAGNETOS project attended the S³ School - Sustainable Scientific Software School of OSCARS / EOSC EVERSE","l":["https://indico.in2p3.fr/event/36319/"],"re":"EVT-0076","tr":"T1 – training activity"},{"i":"OUT-0086","p":"01-167","ty":"Software & Tools","d":"Enhanced code of main tool: The main tool that would be used to assess the quality of transcriptome data had been left without maintenance for some time. Initial development of annotation pipeline: The initial code of the tool that will perform the genome annotation has been developed, taking as model the previous results of the lab. Now, most of the bugs have been fixed and the code has been updated to be easier to understand and develop."},{"i":"OUT-0087","p":"01-167","ty":"Workflows & Pipelines","d":"Pipeline definition. Initial development of annotation pipeline: The initial code of the tool that will perform the genome annotation has been developed, taking as model the previous results of the lab. Coordination with local groups to gather long-reads genomic data: We have established recurrent meetings with other groups that work generating long-reads transcriptomics in a wide range of organisms, to use their data to train the pipeline and increase the number of available annotations that are publicly available Continuous engagement through courses and conferences."},{"i":"OUT-0088","p":"01-167","ty":"Software & Tools","t":"Software package (Zenodo)","l":["https://doi.org/10.5281/zenodo.22682045"]},{"i":"OUT-0089","p":"01-167","ty":"Posters","t":"FAIRification of IsoSeq Evidence-driven annotation of the biodiversity — project poster","l":["https://doi.org/10.5281/zenodo.18799678"]},{"i":"OUT-0090","p":"01-168","ty":"Reports & Plans","d":"protocols have been prepared and published via the DataSet repository to support. Project coordinator Volodymyr Kotsyubynsky joined the WG of the Ministry of Education and Science of Ukraine tasked with developing the national professional standard “Research Data Management Specialist.” The standard addresses all stages of the research data lifecycle — including planning, data collection, documentation, processing, preservation, and dissemination in accordance with FAIR principles."},{"i":"OUT-0091","p":"01-168","ty":"Platforms & Portals","d":"The PNU-OpenLab portal has been launched and is publicly accessible, based on the InvenioRDM framework and fully compliant with FAIR principles. Metadata and DOI assignment are integrated through CrossRef, with interoperability with EOSC ensured via OpenAIRE guidelines and the OAI-PMH protocol."},{"i":"OUT-0092","p":"01-168","ty":"Workflows & Pipelines","d":"Metadata and DOI assignment are integrated through CrossRef, and interoperability with EOSC is ensured via OpenAIRE guidelines and OAI-PMH protocol."},{"i":"OUT-0093","p":"01-168","ty":"Technical Documentation","t":"PNU-DataSet User Manual","l":["https://dataset.cnu.edu.ua/records/zfgee-r2c97"],"tr":"T2 – learning material (user guide / manual; stays in Technical Documentation)"},{"i":"OUT-0094","p":"01-168","ty":"Presentations & Training Resources","k":"Material","t":"CNU-NanoLab. Experimental methods","d":"Training modules prepared for the Advanced Materials Open Science Centre (Vasyl Stefanyk Carpathian National University): 1. UV–Vis spectrophotometry, a practical and theory-backed overview as applied in routine measurements; 2. X-ray diffraction (XRD), an introductory-to-practical module for materials and mineral analysis; 3. X-ray fluorescence (XRF) analysis.","l":["https://dataset.cnu.edu.ua/records/p1hfm-zp711"],"tr":"T2 – learning material"},{"i":"OUT-0095","p":"01-168","ty":"Posters","t":"PNU-OpenLab — project poster","l":["https://doi.org/10.5281/zenodo.18849458"]},{"i":"OUT-0096","p":"01-168","ty":"Repositories","t":"CNU-DataSet","d":"InvenioRDM-powered research data repository established to support the publication, preservation, description and reuse of research data, initially with a strong focus on materials science and related research domains. Complements the experimental infrastructure of CNU-NanoLab, creating a pathway from experimental measurements to structured, reusable and openly accessible research datasets. Currently operational and under active development, following FAIR principles.","l":["https://dataset.cnu.edu.ua/"]},{"i":"OUT-0097","p":"01-168","ty":"Infrastructure & Services","t":"Advanced Materials Open Science Centre in Ukraine","l":["https://open-lab.cnu.edu.ua/"]},{"i":"OUT-0098","p":"01-168","ty":"Software & Tools","t":"InvenioRDM Harvester (GitHub)","l":["https://github.com/Advanced-Materials-Open-Science-Centre/InvenioRDM_Harvester"]},{"i":"OUT-0099","p":"01-168","ty":"Infrastructure & Services","t":"Radnote radiation monitoring station on Mount Pip Ivan (July 2025)","d":"Radnote radiation monitoring station has been installed on Mount Pip Ivan Chornohorskyi, one of the highest peaks in the Ukrainian Carpathians, standing at an altitude of 2,028.5 metres. The installation of the Radnote station on Mount Pip Ivan provides continuous, high-altitude monitoring of ambient radiation levels in the Ukrainian Carpathians at a site with unique environmental conditions and minimal local technogenic influence. The station strengthens both public and scientific oversight by enabling timely detection of anomalies, supporting long-term observation datasets, and improving transparency and accessibility of environmental information for local communities, tourists, emergency services, and research teams."},{"i":"OUT-0100","p":"01-168","ty":"Presentations & Training Resources","k":"Training activity","t":"Workshop ‘Open Science and FAIR: Global strategies for accessibility, interoperability and information security","d":"16 May, 2025 · Ivano-Frankivsk — Presentation of the institutional repository developed at Vasyl Stefanyk Precarpathian National University - dataset.pnu.edu.ua","l":["https://open-lab.pnu.edu.ua/en/2025/05/16/workshop-open-science-and-fair-global-strategies-for-accessibility-interoperability-and-information-security/"],"re":"EVT-0092","tr":"T1 – training activity"},{"i":"OUT-0101" S Annual General Meeting (Seville, 10-12 March 2026) · 69 funded projects took part · all contributions: https://indico.in2p3.fr/event/37069/contributions/"},{"i":"EVT-0027","p":"01-069","dr":"9-13 November 2025","sd":"2025-11-09","ed":"2025-11-13","y":2025,"pl":"Gorlitz, Germany","t":"Astronomical Data Analysis & Software Systems - ADASS Conference","ro":"Attended / contributed","k":"Conference / talk / other dissemination","l":["https://indico.dzastro.de/event/4/contributions/120/"]},{"i":"EVT-0028","p":"01-069","dr":"7-9 October 2025","sd":"2025-10-07","ed":"2025-10-09","y":2025,"pl":"Trieste, Italy","t":"Organisation of the Astro-CC Technology Forum 1, meant to engage the community on the topics of technical standards and interoperability frameworks to enable FAIR data services in the domains of astronomy, heliospheric physics, planetary science, and astro-particle physics. Target audience: ESFRIs, other RIs and experts in the various interoperability frameworks. Goal: share technical expertise and best practices in the implementation of FAIR enabling technologies, and the use and development of open standards. Format: topical sessions followed by practical hack-a-thon sessions for hands-on work in a collaborative mode.","ro":"Organised by the project","k":"Conference / talk / other dissemination","l":["https://indico.in2p3.fr/event/36318/"]},{"i":"EVT-0029","p":"01-069","dr":"2-4 December 2025","sd":"2025-12-02","ed":"2025-12-04","y":2025,"pl":"Madrid, Spain","t":"First Astro-CC Training event - The goal of the Astro-CC project is to enable members of the astronomy, heliospheric physics, planetary science, and astro-particle physics communities to accelerate the use of Open Science by supporting the implementation of FAIR principles. The Virtual Observatory (VO) is opening up new ways of exploiting the huge amount of data provided by the ever-growing number of ground-based and space facilities, as well as by computer simulations. The goal of this Training Event has been twofold: to expose participants to the variety of VO tools and services available today so that they can use them efficiently for their own research; and to gather requirements and feedback from participants. To achieve these goals, VO experts lectured and tutored the participants on the usage of VO tools and services. Real life examples of scientific applications will be given. A large fraction of the time will be dedicated to hands-on exercises, which will allow participants to become fully familiar with the VO capabilities on their own laptops.","ro":"Organised by the project","k":"Training / workshop / webinar","l":["https://indico.in2p3.fr/event/36738/"],"ro2":"OUT-0037, OUT-0038","tr":"T1 – organised a training event"},{"i":"EVT-0030","p":"01-069","dr":"25-27 March 2026","sd":"2026-03-25","ed":"2026-03-27","y":2026,"pl":"Heidelberg, Germany","t":"Astro-CC European Data Provider Forum - The goal of the forum has been to bring together researchers and technicians,  Research Infrastructures, data-intensive projects, astronomy data providers  to exchange knowledge and experience related to the online publication of astronomical and astroparticle data and related services using the International Virtual Observatory Alliance (IVOA) standards to ensure their data is findable and usable with common, standard tools.  This forum is the right place if you want to be FAIR in astronomy, or help others become FAIR. The forum offered a space to discuss shared challenges in data publication; present approaches, solutions, and lessons learned; engage with peers and build connections across projects and infrastructures; participate in practical, hands-on sessions on widely used VO data publication tools and technologies.","ro":"Organised by the project","k":"Conference / talk / other dissemination","l":["https://indico.in2p3.fr/event/37439/"]},{"i":"EVT-0031","p":"01-069","dr":"3-4 March 2025","sd":"2025-03-03","ed":"2025-03-04","y":2025,"pl":"Rome, Italy","t":"1st OS const TYPES = [
 ['Software & Tools','#2FA0DB'],['Datasets & Databases','#4463A0'],['Platforms & Portals','#9E559D'],['Ontologies & Standards','#6A57C0'],
 ['Workflows & Pipelines','#80519A'],['Repositories','#A87DC8'],['Infrastructure & Services','#2E6F8E'],['Technical Documentation','#6B8FC9'],
 ['Reports & Plans','#B0527F'],['Presentations & Training Resources','#3FB0C9'],['Publications','#8A8898'],['Posters','#C9A86A']];
const TCOL = Object.fromEntries(TYPES);
const CLUSTERS = ['ENVRI','ESCAPE','LS-RI','PaNOSC','SSHOC','Other'];
const CCOL = {ENVRI:'#2E8FC4','ESCAPE':'#4463A0','LS-RI':'#9E559D','PaNOSC':'#6A57C0','SSHOC':'#B0527F','Other':'#7F7F80'};
const KINDS = ['Conference / talk / other dissemination','Training / workshop / webinar','Internal / project meeting','OSCARS AGM','Not an event (call for studies)'];
const KLAB = {'Conference / talk / other dissemination':'Conference, talk or dissemination','Training / workshop / webinar':'Training, workshop or webinar','Internal / project meeting':'Project meeting','OSCARS AGM':'OSCARS Annual General Meeting','Not an event (call for studies)':'Other (not an event)'};
const P = DATA.P;
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ---------- derived fields
DATA.O.forEach(o => { const p = P[o.p]; o._s = [o.i,o.p,o.t,o.d,o.ty,p.t,p.c].join(' ').toLowerCase(); });
const SEVN = {};
DATA.E.forEach(e => { if (e.sv) SEVN[e.sv] = (SEVN[e.sv]||0)+1; });
DATA.E.forEach(e => { const p = P[e.p]; e._s = [e.i,e.p,e.t,e.pl,e.dr,e.rp,e.sv,p.t,p.c].join(' ').toLowerCase(); e._ro = (e.ro||'').startsWith('Organised') ? 'Organised' : 'Attended / contributed'; });
const YEARS = [...new Set(DATA.E.map(e=>e.y).filter(Boolean))].sort();
const projOpts = Object.keys(P).sort((a,b)=>P[a].t.localeCompare(P[b].t));

// ---------- state
const S = {
  tab: (location.hash === '#events') ? 'events' : 'outputs',
  q: '', limit: 60,
  outputs: { type:new Set(), cl:new Set(), oc:new Set(), proj:'', linked:false },
  events:  { kind:new Set(), role:new Set(), year:new Set(), cl:new Set(), oc:new Set(), proj:'', agm:true }
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- filtering (facet counts ignore their own facet)
function matchO(o, f, skip){
  const p = P[o.p];
  if (S.q && !S.q.split(/\s+/).every(w => o._s.includes(w))) return false;
  if (skip!=='type' && f.type.size && !f.type.has(o.ty)) return false;
  if (skip!=='cl' && f.cl.size && !p.cl.some(c => f.cl.has(c))) return false;
  if (skip!=='oc' && f.oc.size && !f.oc.has(p.oc)) return false;
  if (f.proj && o.p !== f.proj) return false;
  if (f.linked && !(o.l && o.l.length)) return false;
  return true;
}
function matchE(e, f, skip){
  const p = P[e.p];
  if (S.q && !S.q.split(/\s+/).every(w => e._s.includes(w))) return false;
  if (!f.agm && e.k === 'OSCARS AGM') return false;
  if (skip!=='kind' && f.kind.size && !f.kind.has(e.k)) return false;
  if (skip!=='role' && f.role.size && !f.role.has(e._ro)) return false;
  if (skip!=='year' && f.year.size && !f.year.has(String(e.y||''))) return false;
  if (skip!=='cl' && f.cl.size && !p.cl.some(c => f.cl.has(c))) return false;
  if (skip!=='oc' && f.oc.size && !f.oc.has(p.oc)) return false;
  if (f.proj && e.p !== f.proj) return false;
  return true;
}
const current = () => S.tab === 'outputs' ? DATA.O.filter(o => matchO(o, S.outputs)) : DATA.E.filter(e => matchE(e, S.events));

// ---------- facets
function checkGroup(title, key, options, countFn, colorFn, labelFn){
  const f = S[S.tab];
  const items = options.map(v => {
    const n = countFn(v); const id = `f-${S.tab}-${key}-${String(v).replace(/[^a-z0-9]+/gi,'_')}`;
    const dot = colorFn ? `<span class="dot" style="background:${colorFn(v)}"></span>` : '';
    return `<label class="opt${n?'':' zero'}" for="${id}"><input type="checkbox" id="${id}" data-key="${key}" value="${esc(v)}" ${f[key].has(String(v))?'checked':''}>${dot}<span class="lab">${esc(labelFn?labelFn(v):v)}</span><span class="c">${n}</span></label>`;
  }).join('');
  return `<div class="fgroup"><h3>${title}</h3>${items}</div>`;
}
function projGroup(){
  const f = S[S.tab];
  return `<div class="fgroup"><h3><label for="f-proj">Project</label></h3><select class="fsel" id="f-proj"><option value="">All 70 projects</option>${projOpts.map(k=>`<option value="${k}" ${f.proj===k?'selected':''}>${k} · ${esc(P[k].t.length>60?P[k].t.slice(0,58)+'…':P[k].t)}</option>`).join('')}</select></div>`;
}
function renderFacets(){
  const f = S[S.tab]; let h = '';
  if (S.tab === 'outputs'){
    const cnt = (skip, test) => DATA.O.filter(o => matchO(o, f, skip) && test(o)).length;
    h += checkGroup('Output type','type',TYPES.map(t=>t[0]), v=>cnt('type',o=>o.ty===v), v=>TCOL[v]);
    h += checkGroup('Science cluster','cl',CLUSTERS, v=>cnt('cl',o=>P[o.p].cl.includes(v)), v=>CCOL[v]);
    h += checkGroup('Open Call','oc',['1','2'], v=>cnt('oc',o=>P[o.p].oc===v), null, v=>v==='1'?'1st Open Call':'2nd Open Call');
    h += projGroup();
    h += `<div class="fgroup"><label class="opt" for="f-linked"><input type="checkbox" id="f-linked" ${f.linked?'checked':''}><span class="lab">Only outputs with a link</span></label><p class="fnote">Outputs carry no date in the source data, so the year filter is on the Events tab.</p></div>`;
  } else {
    const cnt = (skip, test) => DATA.E.filter(e => matchE(e, f, skip) && test(e)).length;
    h += checkGroup('Role','role',['Organised','Attended / contributed'], v=>cnt('role',e=>e._ro===v), v=>v==='Organised'?'var(--org)':'var(--att)', v=>v==='Organised'?'Organised by the project':'Attended / contributed');
    h += checkGroup('Kind of event','kind',KINDS, v=>cnt('kind',e=>e.k===v), null, v=>KLAB[v]);
    h += checkGroup('Year','year',YEARS.map(String), v=>cnt('year',e=>String(e.y)===v));
    h += checkGroup('Science cluster','cl',CLUSTERS, v=>cnt('cl',e=>P[e.p].cl.includes(v)), v=>CCOL[v]);
    h += checkGroup('Open Call','oc',['1','2'], v=>cnt('oc',e=>P[e.p].oc===v), null, v=>v==='1'?'1st Open Call':'2nd Open Call');
    h += projGroup();
    h += `<div class="fgroup"><label class="opt" for="f-agm"><input type="checkbox" id="f-agm" ${f.agm?'checked':''}><span class="lab">Include OSCARS AGM entries</span></label><p class="fnote">Each project lists the OSCARS Annual General Meetings it attended (127 entries for 2 meetings).</p></div>`;
  }
  $('facets').innerHTML = h;
}
$('facets').addEventListener('change', ev => {
  const t = ev.target, f = S[S.tab];
  if (t.id === 'f-proj') f.proj = t.value;
  else if (t.id === 'f-linked') f.linked = t.checked;
  else if (t.id === 'f-agm') f.agm = t.checked;
  else if (t.dataset.key){ const set = f[t.dataset.key]; t.checked ? set.add(t.value) : set.delete(t.value); }
  S.limit = 60; update();
});

// ---------- cards
function clusterChips(p){ return `<div class="cls">${p.cl.map(c=>`<span class="cl" style="background:${CCOL[c]}">${c}</span>`).join('')}</div>`; }
function projBlock(pid){
  const p = P[pid];
  return `<div class="proj"><div class="pt"><span class="mono">${pid}</span> · ${p.w?`<a href="${esc(p.w)}" target="_blank" rel="noopener">${esc(p.t)}</a>`:esc(p.t)}</div><div class="row">${clusterChips(p)}<span class="tag">${p.oc==='1'?'1st':'2nd'} Open Call</span>${p.e?'<span class="tag">ended</span>':''}</div></div>`;
}
function linksBlock(l, skipFirst){
  const arr = (l||[]).slice(skipFirst?1:0);
  if (!arr.length) return '';
  return `<div class="links">${arr.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${skipFirst?'Link '+(i+2):'Link '+(i+1)} ↗</a>`).join('')}</div>`;
}
function idButtons(s){ return (s||'').split(', ').filter(Boolean).map(id=>`<button class="idlink" type="button" data-goto="${id}">${id}</button>`).join(' '); }
function descBlock(d){ if(!d) return ''; return `<div class="desc">${esc(d)}</div>${d.length>220?'<button class="more" type="button">Show full description</button>':''}`; }
function cardO(o){
  const title = o.t || (o.d ? (o.d.length>110 ? o.d.slice(0,108)+'…' : o.d) : o.ty);
  const main = o.l && o.l[0];
  const t = main ? `<a href="${esc(main)}" target="_blank" rel="noopener">${esc(title)}</a>` : esc(title);
  const desc = o.t ? ((o.d && o.d !== o.t) ? o.d : '') : ((o.d && o.d.length > 110) ? o.d : '');
  const tier = o.tr && o.tr.startsWith('T') ? `<span class="tag">${o.tr.startsWith('T1')?'Training tier 1':'Training tier 2'}</span>` : '';
  return `<article class="card">
    <div class="row"><span class="typechip"><span class="dot" style="background:${TCOL[o.ty]}"></span>${esc(o.ty)}</span>${o.k==='Training activity'?'<span class="tag">training activity</span>':''}${tier}<span class="id mono">${o.i}</span></div>
    <h4 class="ctitle">${t}</h4>
    ${main?'':'<div><span class="tag warn">no link yet</span></div>'}
    ${descBlock(desc)}
    ${linksBlock(o.l, true)}
    ${o.re?`<div class="rel">Related events: ${idButtons(o.re)}</div>`:''}
    ${o.al?`<div class="rel">Also listed as: ${idButtons(o.al)}</div>`:''}
    ${projBlock(o.p)}
  </article>`;
}
function fmtDate(e){
  if (!e.sd) return e.dr ? esc(e.dr) : 'Date not given';
  const f = s => { const [y,m,d] = s.split('-'); return (d?+d+' ':'')+MON[+m-1]+' '+y; };
  if (!e.ed) return f(e.sd);
  const [y1,m1,d1] = e.sd.split('-'), [y2,m2,d2] = e.ed.split('-');
  if (d1 && d2 && y1===y2 && m1===m2) return (+d1)+'–'+(+d2)+' '+MON[+m1-1]+' '+y1;
  if (d1 && d2 && y1===y2) return (+d1)+' '+MON[+m1-1]+' – '+(+d2)+' '+MON[+m2-1]+' '+y1;
  return f(e.sd)+' – '+f(e.ed);
}
function cardE(e){
  const org = e._ro === 'Organised';
  const main = e.l && e.l[0];
  const t = main ? `<a href="${esc(main)}" target="_blank" rel="noopener">${esc(e.t)}</a>` : esc(e.t);
  const shared = e.sv ? `<div class="rel">Same event recorded by ${SEVN[e.sv]} project${SEVN[e.sv]>1?'s':''} · <button class="idlink" type="button" data-goto="${e.sv}">${e.sv}</button></div>` : '';
  const tier = e.tr && e.tr.startsWith('T1') ? '<span class="tag">Training tier 1</span>' : '';
  return `<article class="card">
    <div class="row"><span class="tag ${org?'org':'att'}">${org?'Organised':'Attended / contributed'}</span><span class="tag">${esc(KLAB[e.k]||e.k)}</span>${tier}<span class="id mono">${e.i}</span></div>
    <div class="when"><b>${fmtDate(e)}</b>${e.pl?' · '+esc(e.pl):''}</div>
    <h4 class="ctitle">${t}</h4>
    ${e.rp?`<div class="desc">Contribution: ${esc(e.rp)}</div>`:''}
    ${linksBlock(e.l, true)}
    ${shared}
    ${e.ro2?`<div class="rel">Related outputs: ${idButtons(e.ro2)}</div>`:''}
    ${projBlock(e.p)}
  </article>`;
}
$('grid').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.classList.contains('more')){ const d = b.previousElementSibling; d.classList.toggle('open'); b.textContent = d.classList.contains('open') ? 'Show less' : 'Show full description'; return; }
  const id = b.dataset.goto; if (!id) return;
  resetFilters(false);
  S.tab = id.startsWith('OUT') ? 'outputs' : 'events';
  S.q = id.toLowerCase(); $('q').value = id; S.limit = 60; update(); window.scrollTo({top:0});
});

// ---------- render
function update(){
  $('tab-outputs').setAttribute('aria-selected', S.tab==='outputs');
  $('tab-events').setAttribute('aria-selected', S.tab==='events');
  renderFacets();
  const res = current();
  const what = S.tab==='outputs' ? 'outputs' : 'event entries';
  const projects = new Set(res.map(r=>r.p)).size;
  let extra = '';
  if (S.tab==='events'){ const distinct = new Set(res.map(e=>e.sv||e.i)).size; extra = ` · ${distinct} distinct event${distinct===1?'':'s'}`; }
  $('rescount').innerHTML = `<b>${res.length}</b> ${what} from <b>${projects}</b> project${projects===1?'':'s'}${extra}`;
  const shown = res.slice(0, S.limit);
  $('grid').innerHTML = shown.length ? shown.map(S.tab==='outputs'?cardO:cardE).join('') : `<div class="empty">No ${what} match these filters. Try removing a filter or a search word.</div>`;
  $('morebtn').hidden = res.length <= S.limit;
  $('morebtn').textContent = `Show more (${res.length - S.limit} left)`;
  $('dl').disabled = !res.length;
}
$('morebtn').addEventListener('click', () => { S.limit += 60; update(); });
let qt; $('q').addEventListener('input', ev => { clearTimeout(qt); qt = setTimeout(() => { S.q = ev.target.value.trim().toLowerCase(); S.limit = 60; update(); }, 120); });
function resetFilters(all=true){
  S.outputs = { type:new Set(), cl:new Set(), oc:new Set(), proj:'', linked:false };
  S.events = { kind:new Set(), role:new Set(), year:new Set(), cl:new Set(), oc:new Set(), proj:'', agm:true };
  if (all){ S.q=''; $('q').value=''; }
}
$('reset').addEventListener('click', () => { resetFilters(true); S.limit=60; update(); });
['outputs','events'].forEach(t => $('tab-'+t).addEventListener('click', () => { S.tab=t; S.limit=60; update(); }));

// ---------- download
function exportRows(){
  const res = current();
  if (S.tab==='outputs') return res.map(o => { const p=P[o.p]; return {
    'Output ID':o.i,'Project code':o.p,'Project':p.t,'Science cluster':p.c,'Open Call':p.oc==='1'?'1st':'2nd','Output type':o.ty,
    'Kind':o.k||'','Output title':o.t||'','Description':o.d||'','Link':(o.l||[])[0]||'','Additional links':(o.l||[]).slice(1).join(' '),
    'Related event IDs':o.re||'','Also listed as':o.al||'','Training tier':o.tr||'','Project page':p.w||''}; });
  return res.map(e => { const p=P[e.p]; return {
    'Event ID':e.i,'Project code':e.p,'Project':p.t,'Science cluster':p.c,'Open Call':p.oc==='1'?'1st':'2nd','Date (as reported)':e.dr||'',
    'Start date':e.sd||'','End date':e.ed||'','Year':e.y||'','Place':e.pl||'','Event / activity':e.t,'Role':e.ro||'','Kind of event':e.k||'',
    'Shared event ID':e.sv||'','Related presentation / contribution':e.rp||'','Link':(e.l||[])[0]||'','Additional links':(e.l||[]).slice(1).join(' '),
    'Related output IDs':e.ro2||'','Training tier':e.tr||''}; });
}
async function download(){
  const msg = $('dlmsg'); msg.textContent = '';
  const rows = exportRows();
  let buf, name, mime;
  if (typeof XLSX !== 'undefined'){
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = Object.keys(rows[0]).map(k => ({wch: Math.min(60, Math.max(10, k.length+2))}));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, S.tab==='outputs'?'Outputs':'Events');
    buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    name = `OSCARS-${S.tab}-${rows.length}.xlsx`; mime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  } else {
    // spreadsheet library unavailable: fall back to CSV, which Excel opens directly
    const cols = Object.keys(rows[0]);
    const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
    buf = '\ufeff' + [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n');
    name = `OSCARS-${S.tab}-${rows.length}.csv`; mime = 'text/csv';
  }
  if (window.claude && typeof window.claude.use === 'function'){
    const d = await window.claude.use('downloads');
    if (!d){ msg.textContent = 'Downloads are not available in this view.'; return; }
    try { await d.save({filename:name, data:new Blob([buf])}); msg.textContent = `Saved ${rows.length} rows.`; }
    catch(err){ msg.textContent = err && err.code === 'declined' ? 'Download cancelled.' : 'The file could not be saved here.'; }
    return;
  }
  const url = URL.createObjectURL(new Blob([buf], {type:mime}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  msg.textContent = `Downloaded ${rows.length} rows.`;
}
$('dl').addEventListener('click', download);

// ---------- header
(function(){
  const nO = DATA.O.length, nL = DATA.O.filter(o=>o.l&&o.l.length).length;
  const nE = DATA.E.length, nD = new Set(DATA.E.filter(e=>e.k!=='Not an event (call for studies)').map(e=>e.sv||e.i)).size;
  $('n-outputs').textContent = nO; $('n-events').textContent = nE;
  $('stats').innerHTML = [[70,'funded projects'],[nO,'outputs'],[nL,'with a link'],[nD,'distinct events']].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('foot').innerHTML = `Data: OSCARS funded projects database (outputs, events and final survey), project pages on oscars-project.eu, the funded projects’ updates and the D4.4 Impact Report · updated ${DATA.updated}. Each output is listed once under the type it matches; the type describes what the output is, not where it is hosted. Event entries are listed per project, so an event several projects attended appears once per project and shares an event ID starting with SEV. IDs (OUT-, EVT-, SEV-) are permanent and match the source spreadsheet.`;
})();
update();
</script>
